
{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="row justify-content-center mt-5">
        <div class="col-md-5">

            <div class="card shadow p-4">
                <h2 class="text-center mb-4">Login</h2>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Username">
                    </div>

                    <div class="mb-3">
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Password">
                    </div>

                    <div class="d-grid">
                        <button
                            type="submit"
                            class="btn btn-warning">
                            Login
                        </button>
                    </div>

                    <div class="text-center mt-3">
                        <a href="/password-reset/">
                            Forgot Password?
                        </a>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

{% endblock %}
